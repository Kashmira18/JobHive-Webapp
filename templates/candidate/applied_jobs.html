{% extends "candidate/candidate_base.html" %}

{% block content %}
{%load static%}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Applied Jobs</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/candidate/AppliedJobs.css'%}">
</head>

<body>
    <div class="container-fluid py-4 px-4">

        <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
            <span class="page-heading">My Applications</span>
            <div class="d-flex gap-2 flex-wrap">
                <input class="form-control form-control-sm" style="width:200px" id="search"
                    placeholder="Search job or company..." oninput="render()" />
                <select class="form-select form-select-sm" style="width:170px" id="filter" onchange="render()">
                    <option value="">All Status</option>
                    <option>Applied</option>
                    <option>Under Review</option>
                    <option>Interview Scheduled</option>
                    <option>Offer Received</option>
                    <option>Hired</option>
                    <option>Rejected</option>
                </select>
            </div>
        </div>

        <!-- <div class="alert alert-light border d-flex align-items-center gap-2 py-2 px-3 notice-bar mb-3">
            <span>ℹ️</span>
            <span>Application status is updated by the employer. You can only view your application details — editing is
                not
                available.</span>
        </div> -->

        {% include "candidate/applied_jobs_table.html" with applications=applications %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>


        // FIX 1: Uncommented the default return so it doesn't return undefined
        function effectiveStatus(j) {
            if (['Hired', 'Rejected', 'Offer Received', 'Withdrawn'].includes(j.status)) return j.status;
            return j.status;
        }

        // FIX 2: Uncommented necessary helper functions
        function sk(s) { return s.replace(/ /g, '-').toLowerCase(); }
        function initials(t) { return t.split(' ').slice(0, 2).map(w => w[0]).join('').toUpperCase(); }

        let page = 1; const PER = 8;
        let bsModal = null;

        function filtered() {
            const q = document.getElementById('search').value.toLowerCase();
            const f = document.getElementById('filter').value;
            return JOBS.filter(j => {
                const es = effectiveStatus(j);
                return (j.title.toLowerCase().includes(q) || j.company.toLowerCase().includes(q) || j.city.toLowerCase().includes(q)) && (!f || es === f);
            });
        }

        function render() {
            const data = filtered();
            const total = data.length;
            const pages = Math.max(1, Math.ceil(total / PER));
            if (page > pages) page = 1;
            const slice = data.slice((page - 1) * PER, page * PER);
            const tb = document.getElementById('tbody');

            if (!slice.length) {
                tb.innerHTML = '<tr><td colspan="5" class="text-center py-4">No applications found</td></tr>';

                // Clear pagination if no data
                document.getElementById('count-label').textContent = '';
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            tb.innerHTML = slice.map(j => {
                const es = effectiveStatus(j);
                const s = sk(es);
                return `<tr onclick="openDetail(${j.id})" style="cursor: pointer;">
        <td class="px-3">
            <div class="d-flex align-items-center gap-2">
                <div class="avatar bg-light text-dark fw-bold rounded-circle d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">${initials(j.title)}</div>
                <div><div class="job-name fw-semibold">${j.title}</div><div class="job-salary text-muted" style="font-size: 12px;">${j.salary}</div></div>
            </div>
        </td>
        <td class="px-3 align-middle">${j.city}</td>
        <td class="px-3 align-middle">${j.date}</td>
        <td class="px-3 align-middle"><span class="status-badge s-${s}"><span class="sdot sd-${s}"></span>${es}</span></td>
        <td class="px-3 align-middle text-end"><button class="btn btn-sm btn-outline-secondary">View</button></td>
    </tr>`;
            }).join('');

            // FIX 3: Added basic pagination logic to satisfy your HTML elements
            document.getElementById('count-label').textContent = `Showing ${(page - 1) * PER + 1}-${Math.min(page * PER, total)} of ${total}`;

            let paginationHTML = '';
            for (let i = 1; i <= pages; i++) {
                paginationHTML += `<button class="btn btn-sm ${i === page ? 'btn-primary' : 'btn-outline-secondary'}" onclick="goPage(${i})">${i}</button>`;
            }
            document.getElementById('pagination').innerHTML = paginationHTML;
        }

        function goPage(p) { page = p; render(); }

    </script>

</body>

</html>
{%endblock%}
